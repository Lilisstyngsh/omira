name: omira

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-OMIRA}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_STACK: "${LOG_STACK:-single}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-omira}"
      DB_USERNAME: "${DB_USERNAME:-omira}"
      DB_PASSWORD: "${DB_PASSWORD:?Ubah DB_PASSWORD di file .env.docker terlebih dahulu}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - omira_storage:/var/www/html/storage

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-omira}"
      MYSQL_USER: "${DB_USERNAME:-omira}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Ubah DB_PASSWORD di file .env.docker terlebih dahulu}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Ubah DB_ROOT_PASSWORD di file .env.docker terlebih dahulu}"
    volumes:
      - omira_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  omira_mysql_data:
  omira_storage:
