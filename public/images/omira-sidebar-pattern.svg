  <g fill="#91CBB8">
    <circle cx="190" cy="58" r="3.1" fill-opacity=".10"/><circle cx="218" cy="58" r="3.1" fill-opacity=".14"/><circle cx="246" cy="58" r="3.1" fill-opacity=".16"/>
