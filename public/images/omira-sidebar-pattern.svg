<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 1000" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DBDAE" stop-opacity=".10"/>
      <stop offset="1" stop-color="#7DBDAE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91C9B6" stop-opacity=".035"/>
      <stop offset=".48" stop-color="#91C9B6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#91C9B6" stop-opacity=".055"/>
    </linearGradient>
  </defs>

  <!-- Upper-right arcs and soft glow. -->
  <circle cx="298" cy="-28" r="205" fill="url(#topGlow)"/>
  <circle cx="298" cy="-28" r="150" stroke="#8DC4B2" stroke-opacity=".13" stroke-width="1.2"/>
