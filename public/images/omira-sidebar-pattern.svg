  <g fill="#91CBB8">
    <circle cx="12" cy="792" r="3.1" fill-opacity=".05"/><circle cx="40" cy="792" r="3.1" fill-opacity=".07"/><circle cx="68" cy="792" r="3.1" fill-opacity=".08"/><circle cx="96" cy="792" r="3.1" fill-opacity=".07"/><circle cx="124" cy="792" r="3.1" fill-opacity=".05"/>
    <circle cx="12" cy="820" r="3.1" fill-opacity=".08"/><circle cx="40" cy="820" r="3.1" fill-opacity=".12"/><circle cx="68" cy="820" r="3.1" fill-opacity=".14"/><circle cx="96" cy="820" r="3.1" fill-opacity=".12"/><circle cx="124" cy="820" r="3.1" fill-opacity=".08"/>
