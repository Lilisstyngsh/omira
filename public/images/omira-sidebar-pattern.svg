  <path d="M-45 812 C22 773 73 814 125 844 C175 873 224 861 300 793" stroke="#8DC4B2" stroke-opacity=".12" stroke-width="1.1"/>
  <path d="M-40 902 C20 833 73 838 130 888 C185 936 231 920 302 848" stroke="#8DC4B2" stroke-opacity=".07" stroke-width="1.1"/>
  <circle cx="306" cy="1018" r="205" stroke="#8DC4B2" stroke-opacity=".10" stroke-width="1.3"/>
  <circle cx="306" cy="1018" r="158" stroke="#8DC4B2" stroke-opacity=".08" stroke-width="1.1"/>
  <circle cx="-50" cy="1010" r="208" stroke="#8DC4B2" stroke-opacity=".09" stroke-width="1.2"/>

