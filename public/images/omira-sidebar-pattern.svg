    <circle cx="12" cy="876" r="3.1" fill-opacity=".06"/><circle cx="40" cy="876" r="3.1" fill-opacity=".10"/><circle cx="68" cy="876" r="3.1" fill-opacity=".12"/><circle cx="96" cy="876" r="3.1" fill-opacity=".10"/><circle cx="124" cy="876" r="3.1" fill-opacity=".06"/>
